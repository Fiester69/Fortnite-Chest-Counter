
name: Build ChestCounter_Setup.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Tesseract
        run: |
          choco install tesseract --yes --no-progress
          New-Item -ItemType Directory -Force -Path tess
          Copy-Item "C:\Program Files\Tesseract-OCR\*" tess -Recurse -Force

      - name: Create icon
        run: python make_icon.py

      - name: Build application
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name ChestCounter --icon app.ico --add-data "tess;tess" --hidden-import mss.windows chest_counter.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ChestCounter-Installer
          path: Output/ChestCounter_Setup.exe

